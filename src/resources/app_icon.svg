<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B9BFF"/>
      <stop offset="0.5" stop-color="#3D74F6"/>
      <stop offset="1" stop-color="#7B4DF6"/>
    </linearGradient>
  </defs>

  <!-- 应用方砖 -->
  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#tile)"/>

  <!-- 取景框四角（截图/选区语言） -->
  <g fill="none" stroke="#FFFFFF" stroke-width="28" stroke-linecap="round" stroke-linejoin="round">
    <path d="M128 200 V156 Q128 128 156 128 H200"/>
    <path d="M312 128 H356 Q384 128 384 156 V200"/>
    <path d="M128 312 V356 Q128 384 156 384 H200"/>
    <path d="M312 384 H356 Q384 384 384 356 V312"/>
  </g>

  <!-- 弹出面板（pop/贴图）：先画投影色块再画本体 -->
  <g transform="rotate(-8 272 300)">
    <rect x="182" y="237" width="196" height="152" rx="28" fill="#17356E" opacity="0.28"/>
    <rect x="172" y="225" width="196" height="152" rx="28" fill="#FFFFFF"/>
    <rect x="200" y="270" width="112" height="15" rx="7.5" fill="#3D74F6" opacity="0.45"/>
    <rect x="200" y="302" width="74" height="15" rx="7.5" fill="#3D74F6" opacity="0.30"/>
    <circle cx="362" cy="230" r="25" fill="#FFB020" stroke="#FFFFFF" stroke-width="12"/>
  </g>
</svg>
